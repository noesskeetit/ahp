apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ahp-state
  namespace: ahp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ahp-state
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
