apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahp-model
  namespace: ahp
  labels:
    app.kubernetes.io/name: ahp-model
    app.kubernetes.io/component: model
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ahp-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ahp-model
        app.kubernetes.io/component: model
    spec:
      serviceAccountName: ahp-model
      containers:
        - name: ahp
          image: ahp-platform/ahp:sha-8b14a59  # pin source commit sha (reproducible); build pipeline rewrites to exact build sha
          args: ["--role", "model", "--listen", ":8080"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: ahp-model-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ahp-model
  namespace: ahp
spec:
  selector:
    app.kubernetes.io/name: ahp-model
  ports:
    - port: 443
      targetPort: http
      protocol: TCP
