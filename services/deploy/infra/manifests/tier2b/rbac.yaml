# Minimal RBAC: ahp service accounts can read their own secrets only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ahp-secret-reader
  namespace: ahp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ahp-state-env", "ahp-identity-env", "ahp-model-env"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ahp-state-secret-reader
  namespace: ahp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ahp-secret-reader
subjects:
  - kind: ServiceAccount
    name: ahp-state
    namespace: ahp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ahp-identity-secret-reader
  namespace: ahp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ahp-secret-reader
subjects:
  - kind: ServiceAccount
    name: ahp-identity
    namespace: ahp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ahp-model-secret-reader
  namespace: ahp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ahp-secret-reader
subjects:
  - kind: ServiceAccount
    name: ahp-model
    namespace: ahp
