receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 100
    spike_limit_mib: 20
  transform/no_content:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - set(resource.schema_url, "")
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: scope
        statements:
          - set(scope.schema_url, "")
          - keep_keys(attributes, [])
          - set(name, "ahp")
          - set(version, "")
      - context: span
        statements:
          - keep_keys(attributes, ["http.method", "http.status_code", "service", "ahp.operation", "ahp.component"])
          - set(status.message, "")
          - set(name, "ahp.request")
          - set(trace_state, "")
          - set(events, nil)
          - set(links, nil)
  batch:
    timeout: 1s
    send_batch_size: 64
exporters:
  file:
    path: /evidence/traces.jsonl
    rotation:
      max_megabytes: 10
      max_backups: 2
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/no_content, batch]
      exporters: [file]
