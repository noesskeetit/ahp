# AHP — локальная инфраструктура разработки (чистая реализация, задача 18).
#
# ГРАНИЦЫ ИЗОЛЯЦИИ (обязательны):
#   * Проект Compose — ahp-handbook (npm run infra:up). Имена контейнеров,
#     томов и сети задаёт Compose с префиксом проекта ahp-handbook; явные
#     container_name и внешние имена volume/network намеренно НЕ задаются.
#   * Ключи сервисов и томов — НОВЫЕ, с префиксом go-*; контейнеры, тома и сети
#     прежнего backend не используются и не переиспользуются.
#   * Порты публикуются ТОЛЬКО на 127.0.0.1.
#   * Обязательные переменные интерполируются из .env (шаблон — .env.example);
#     в этом файле секретов нет. Сообщения обязательных переменных не содержат
#     ": " и интерполяции обёрнуты в кавычки — файл остаётся валидным YAML.
#
# Инфраструктура: PostgreSQL/pgvector, Redis, MinIO (S3), Vault.
# Контейнеры приложения: go-ahp-all (dev, все роли), go-ahp-state,
# go-ahp-identity, go-ahp-model (раздельная эксплуатация).
#
# Запуск:  docker compose -p ahp-handbook up -d --wait go-postgres go-redis go-minio go-vault
# С приложением: docker compose -p ahp-handbook up -d --wait

name: ahp-handbook

networks:
  go-platform:
    driver: bridge

volumes:
  go-postgres-data:
  go-redis-data:
  go-minio-data:
  go-vault-data:
  go-ahp-tls:

services:
  go-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${AHP_POSTGRES_USER:?required set AHP_POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${AHP_POSTGRES_PASSWORD:?required set AHP_POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${AHP_POSTGRES_DB:?required set AHP_POSTGRES_DB in .env}"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - go-postgres-data:/var/lib/postgresql/data
      # Скрипты этого каталога выполняются образом postgres при первом старте
      # на ПУСТОМ томе. Файл идемпотентен и не содержит DROP/ALTER.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    networks:
      - go-platform
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  go-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Персистентность: AOF включён явно.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - "${AHP_REDIS_PASSWORD:?required set AHP_REDIS_PASSWORD in .env}"
    environment:
      # REDISCLI_AUTH читается redis-cli автоматически: healthcheck
      # аутентифицирован, пароль не попадает в командную строку healthcheck.
      REDISCLI_AUTH: "${AHP_REDIS_PASSWORD:?required set AHP_REDIS_PASSWORD in .env}"
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - go-redis-data:/data
    networks:
      - go-platform
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ─── Application services ─────────────────────────────────────────────
  # Build once with: docker compose -p ahp-handbook build go-ahp-all
  # Then run individual roles or the all-in-one dev container.

  go-ahp-all:
    # Reap orphaned command children after Compute sleep/cancel.
    init: true
    # Dev: all roles co-located on a single port. NOT for production.
    image: ahp-handbook-ahp:local
    build:
      context: .
      dockerfile: infra/Dockerfile.ahp
      # Pin the revision this dev image claims, when the caller knows it:
      #   AHP_BUILD_REVISION=$(git rev-parse HEAD) docker compose build go-ahp-all
      # It lands in an OCI label only. This image cannot carry Go build-info
      # (no .git in the build context) and is built without the canonical
      # ahp_exec,ahp_data tags, so it is never an acceptance subject -- see the
      # header of infra/Dockerfile.ahp.
      args:
        REVISION: ${AHP_BUILD_REVISION:-unset}
    profiles: ["app", "dev"]
    restart: unless-stopped
    environment:
      AHP_ROLE: all
      AHP_LISTEN: ":8080"
      AHP_DATABASE_URL: "postgres://${AHP_POSTGRES_USER:?}:${AHP_POSTGRES_PASSWORD:?}@go-postgres:5432/${AHP_POSTGRES_DB:?}?sslmode=disable"
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - go-platform
    depends_on:
      go-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  go-ahp-state:
    image: ahp-handbook-ahp:local
    profiles: ["app"]
    restart: unless-stopped
    environment:
      AHP_ROLE: state
      AHP_LISTEN: ":8080"
      AHP_DATABASE_URL: "postgres://${AHP_POSTGRES_USER:?}:${AHP_POSTGRES_PASSWORD:?}@go-postgres:5432/${AHP_POSTGRES_DB:?}?sslmode=disable"
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - go-platform
    depends_on:
      go-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  go-ahp-identity:
    image: ahp-handbook-ahp:local
    profiles: ["app"]
    restart: unless-stopped
    environment:
      AHP_ROLE: identity
      AHP_LISTEN: ":8080"
      AHP_DATABASE_URL: "postgres://${AHP_POSTGRES_USER:?}:${AHP_POSTGRES_PASSWORD:?}@go-postgres:5432/${AHP_POSTGRES_DB:?}?sslmode=disable"
    ports:
      - "127.0.0.1:18082:8080"
    networks:
      - go-platform
    depends_on:
      go-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  go-ahp-model:
    image: ahp-handbook-ahp:local
    profiles: ["app"]
    restart: unless-stopped
    environment:
      AHP_ROLE: model
      AHP_LISTEN: ":8080"
      AHP_DATABASE_URL: "postgres://${AHP_POSTGRES_USER:?}:${AHP_POSTGRES_PASSWORD:?}@go-postgres:5432/${AHP_POSTGRES_DB:?}?sslmode=disable"
    ports:
      - "127.0.0.1:18083:8080"
    networks:
      - go-platform
    depends_on:
      go-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  go-minio:
    # Публичный prebuilt-образ MinIO не выгружается (Docker Hub — отсутствующие
    # слои, Quay — 401), поэтому образ собирается из исходников официального
    # тега RELEASE.2025-10-15T17-29-55Z (commit 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a).
    # Контекст — игнорируемый каталог .local/minio-src; dockerfile указывается
    # относительно контекста сборки. Сборка: npm run infra:minio:build.
    image: ahp-handbook-minio:9e49d5e7
    build:
      context: ./.local/minio-src
      dockerfile: ../../infra/minio.Dockerfile
    restart: unless-stopped
    command:
      - server
      - /data
      - --address
      - ":9000"
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: "${AHP_MINIO_ROOT_USER:?required set AHP_MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${AHP_MINIO_ROOT_PASSWORD:?required set AHP_MINIO_ROOT_PASSWORD in .env}"
    ports:
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"
    volumes:
      - go-minio-data:/data
    networks:
      - go-platform
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  go-vault:
    # Dev-режим: изолированный локальный контур, один процесс, без TLS.
    # НЕ для production: dev-режим не шифрует хранилище и пишет секреты в лог.
    image: hashicorp/vault:1.19
    restart: unless-stopped
    command:
      - vault
      - server
      - -dev
      - "-dev-root-token-id=${AHP_VAULT_DEV_TOKEN:?required set AHP_VAULT_DEV_TOKEN in .env}"
      - "-dev-listen-address=0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${AHP_VAULT_DEV_TOKEN:?required set AHP_VAULT_DEV_TOKEN in .env}"
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:28200:8200"
    volumes:
      - go-vault-data:/vault/file
    networks:
      - go-platform
    healthcheck:
      # vault status завершается успешно только когда сервер отвечает и
      # хранилище распаковано; повторных login-запросов нет.
      test:
        - CMD
        - vault
        - status
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
